[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "l4d2-mod-db"
version = "0.1.0rc4"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "RABrian"}]
description = "Read-only L4D2 Workshop collection manager and explanatory Planning (M6.4 pre-release)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["Pillow>=12.3,<13"]

[project.scripts]
l4d2-mod-db = "l4d2_mod_db.cli:main"

[tool.setuptools.packages.find]
include = ["l4d2_mod_db*"]
