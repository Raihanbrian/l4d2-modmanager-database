name: Bug report
description: Report a reproducible application problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Remove personal paths, account data and unrelated screenshots. Do not upload credentials, catalogs or Workshop VPKs. A resource overlap is not automatically a crash."
  - type: input
    id: version
    attributes:
      label: App version and launch method
      placeholder: "0.1.0rc4 portable EXE, or source"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include offline/online state and whether a synthetic fixture can reproduce it.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Distinguish an app error, visual/game behavior, server rejection and an actual game crash.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional redacted evidence
      description: Review screenshots or error text for personal data before posting.
